<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>CineBook Test Checkout</title>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>

<body>
  <button id="pay">Pay ₹250 (Test)</button>
  <p id="result"></p>

  <script>
    document.getElementById("pay").addEventListener("click", () => {
      const checkout = new Razorpay({
        key: "rzp_test_U3FtAWSPax41DU",
        order_id: "order_U3t7QC9QO6b4F1",
        name: "CineBook",
        handler: async (result) => {
          const verificationBody = {
            razorpay_payment_id: result.razorpay_payment_id,
            razorpay_order_id: result.razorpay_order_id,
            razorpay_signature: result.razorpay_signature,
          };
          const output = document.getElementById("result");
          const token = window.prompt("Paste your CineBook access token");

          if (!token?.trim()) {
            output.textContent = "Verification skipped. Check your booking before paying again.";
            return;
          }

          try {
            const response = await fetch(
              "/api/v1/bookings/af69b929-d64d-45c3-8e30-0c22561018e0/payments/de716023-397e-43af-b26d-b6bfe1dc5658/verify",
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  Authorization: `Bearer ${token.trim()}`,
                },
                body: JSON.stringify(verificationBody),
              },
            );

            if (!response.ok) throw new Error(`HTTP ${response.status}`);

            const { payment_status } = await response.json();
            output.textContent = payment_status === "completed"
              ? "Booking confirmed."
              : "Payment received. This payment is under review.";
          } catch {
            output.textContent = "Verification failed. Check your booking before paying again.";
          }
        }
      });

      checkout.open();
    });
  </script>
</body>

</html>
