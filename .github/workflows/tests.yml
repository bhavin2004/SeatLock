name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg2://test:test@127.0.0.1:5432/cinebook_ci
      JWT_SECRET_KEY: ci-only-placeholder
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Install dependencies
        run: uv sync --locked --dev --python 3.14
      - name: Run tests
        run: uv run --no-sync python -m pytest --ignore=tests/test_booking_concurrency.py -q
